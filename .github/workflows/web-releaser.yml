name: Web Releaser

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
    paths:
      - "web/**"
  pull_request:
    branches: ["main"]
    paths:
      - "web/**"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: seheon99/build-and-deploy@v1
        with:
          service-name: summer-homework-diary-web
          registry: ghcr.io/seheon99/summer-homework-diary-web
          context: web
          dry-run: ${{ github.event_name == 'pull_request' }}
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
          ssh-key: ${{ secrets.SSH_KEY }}
          ssh-port: ${{ secrets.SSH_PORT || 22 }}
